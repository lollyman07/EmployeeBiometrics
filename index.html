<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg:#0B0F13;
  --bg-2:#0F151A;
  --surface:#161D23;
  --surface-2:#1E272E;
  --surface-3:#26313A;
  --border:#2A343C;
  --text:#EAEEF1;
  --text-dim:#8D9AA5;
  --text-faint:#5E6A73;
  --accent:#33E6A0;
  --accent-dim:#1D8F63;
  --accent-glow:rgba(51,230,160,.35);
  --info:#5B8CFF;
  --warn:#F5B942;
  --danger:#FF6B5E;
  --rest:#7C8B99;
  --leave:#8C7CFF;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font-display:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
[data-theme="light"]{
  --bg:#F3F5F6;
  --bg-2:#EAEDEF;
  --surface:#FFFFFF;
  --surface-2:#F5F7F8;
  --surface-3:#EBEFF1;
  --border:#DDE3E7;
  --text:#141A1F;
  --text-dim:#5A6771;
  --text-faint:#8A96A0;
  --accent:#0FA36B;
  --accent-dim:#0C8557;
  --accent-glow:rgba(15,163,107,.25);
  --shadow:0 10px 30px rgba(20,30,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:radial-gradient(1200px 800px at 80% -10%, rgba(51,230,160,.06), transparent 60%), var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 11px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:500;letter-spacing:.02em}
.field{margin-bottom:14px}
.mono{font-family:var(--font-mono)}
.hidden{display:none !important}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px}

/* ============ LAYOUT ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:236px;flex:0 0 236px;background:var(--bg-2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px}
.brand-mark{
  width:34px;height:34px;border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px var(--accent-glow);flex:0 0 auto;
}
.brand-mark svg{width:100%;height:100%}
.brand-text{font-family:var(--font-display);font-weight:700;font-size:14.5px;letter-spacing:.01em;line-height:1.2}
.brand-text span{display:block;font-family:var(--font-body);font-weight:500;font-size:10.5px;color:var(--text-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;flex:1}
.nav-btn{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--radius-sm);border:none;background:transparent;
  color:var(--text-dim);font-size:13.5px;font-weight:500;text-align:left;transition:all .12s;
}
.nav-btn svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav-btn:hover{background:var(--surface-2);color:var(--text)}
.nav-btn.active{background:var(--surface-2);color:var(--text)}
.nav-btn.active{box-shadow:inset 3px 0 0 var(--accent)}
.nav-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.theme-toggle{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;border:1px solid var(--border)}
.theme-toggle button{flex:1;background:transparent;border:none;border-radius:999px;padding:6px 0;font-size:12px;color:var(--text-dim)}
.theme-toggle button.active{background:var(--surface-3);color:var(--text)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 26px;background:color-mix(in srgb, var(--bg) 80%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.topbar h1{font-family:var(--font-display);font-size:19px;font-weight:700}
.topbar .sub{font-size:12.5px;color:var(--text-dim);margin-top:2px}
.top-right{display:flex;align-items:center;gap:10px}
.menu-btn{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);width:38px;height:38px;align-items:center;justify-content:center;color:var(--text)}
.content{padding:22px 26px 60px;max-width:1320px;width:100%;margin:0 auto}

/* ============ COMPONENTS ============ */
.grid{display:grid;gap:16px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media(max-width:1080px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.card-tight{padding:14px 16px}
.stat-card{display:flex;flex-direction:column;gap:6px}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-dim);font-weight:600}
.stat-value{font-family:var(--font-display);font-size:26px;font-weight:700}
.stat-sub{font-size:12px;color:var(--text-faint)}
.section-title{font-family:var(--font-display);font-size:16px;font-weight:700;margin-bottom:4px}
.section-desc{font-size:12.5px;color:var(--text-dim);margin-bottom:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row-gap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface-2);
  color:var(--text);padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;transition:.12s;white-space:nowrap;
}
.btn:hover{background:var(--surface-3)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04140D}
.btn-primary:hover{filter:brightness(1.08)}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#280A08}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-block{width:100%}
.btn-lg{padding:16px 20px;font-size:15px;border-radius:12px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim)}
.icon-btn:hover{color:var(--text);background:var(--surface-3)}
.icon-btn svg{width:14px;height:14px}

.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.01em}
.badge-dot{width:6px;height:6px;border-radius:50%}
.badge-present{background:rgba(51,230,160,.14);color:var(--accent)}
.badge-present .badge-dot{background:var(--accent)}
.badge-late{background:rgba(245,185,66,.15);color:var(--warn)}
.badge-late .badge-dot{background:var(--warn)}
.badge-absent{background:rgba(255,107,94,.14);color:var(--danger)}
.badge-absent .badge-dot{background:var(--danger)}
.badge-overtime{background:rgba(140,124,255,.16);color:var(--leave)}
.badge-overtime .badge-dot{background:var(--leave)}
.badge-leave{background:rgba(91,140,255,.15);color:var(--info)}
.badge-leave .badge-dot{background:var(--info)}
.badge-rest{background:rgba(124,139,153,.16);color:var(--rest)}
.badge-rest .badge-dot{background:var(--rest)}
.badge-incomplete{background:rgba(255,107,94,.1);color:var(--danger)}
.badge-incomplete .badge-dot{background:var(--danger)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-dim);padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-weight:600}
td{padding:10px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm)}
.empty-state{text-align:center;padding:46px 20px;color:var(--text-dim)}
.empty-state svg{width:38px;height:38px;color:var(--text-faint);margin-bottom:10px}
.empty-state .t{font-weight:600;color:var(--text);margin-bottom:4px}

.search-input{position:relative;flex:1;min-width:200px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;border:1px solid var(--border);width:fit-content}
.tab{padding:7px 14px;border:none;background:transparent;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text-dim)}
.tab.active{background:var(--surface-3);color:var(--text)}

/* ============ TERMINAL ============ */
.terminal{
  background:linear-gradient(160deg,var(--surface) 0%,var(--surface-2) 100%);
  border:1px solid var(--border);border-radius:20px;padding:30px;position:relative;overflow:hidden;
}
.terminal::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 15% 0%, var(--accent-glow), transparent 55%);opacity:.5;pointer-events:none}
.term-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;position:relative}
.term-greeting{font-family:var(--font-display);font-size:22px;font-weight:700}
.term-emp{color:var(--text-dim);font-size:13.5px;margin-top:4px}
.term-clock{text-align:right}
.term-date{font-size:12.5px;color:var(--text-dim)}
.term-time{font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:.02em;color:var(--accent)}
.term-mid{display:flex;gap:22px;align-items:center;margin:26px 0;flex-wrap:wrap;position:relative}
.scanner{
  width:112px;height:112px;border-radius:50%;flex:0 0 auto;background:var(--surface-2);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;position:relative;
}
.scanner svg{width:52px;height:52px;color:var(--text-faint);transition:color .3s}
.scanner.scanning{border-color:var(--accent)}
.scanner.scanning svg{color:var(--accent)}
.scanner.verified{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-glow)}
.scanner.verified svg{color:var(--accent)}
.scan-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid var(--accent);opacity:0}
.scanner.scanning .scan-ring{animation:ring 1.4s ease-out infinite}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);top:50%;opacity:0;filter:drop-shadow(0 0 6px var(--accent))}
.scanner.scanning .scan-line{animation:sweep 1.2s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}
@keyframes sweep{0%{top:14%;opacity:0}20%{opacity:1}80%{opacity:1}100%{top:86%;opacity:0}}
.term-status{flex:1;min-width:200px}
.status-line{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--text-dim);font-weight:600;margin-bottom:8px}
.status-value{font-family:var(--font-display);font-weight:700;font-size:18px;display:flex;align-items:center;gap:9px}
.status-meta{margin-top:10px;display:flex;gap:22px;flex-wrap:wrap}
.status-meta div span{display:block}
.status-meta .k{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em}
.status-meta .v{font-family:var(--font-mono);font-size:15px;font-weight:600;margin-top:2px}
.term-actions{display:flex;gap:12px;position:relative;flex-wrap:wrap}
.term-actions .btn{flex:1;min-width:150px}
.empty-scan-msg{font-size:12.5px;color:var(--text-faint);margin-top:8px}

/* ============ MODAL / TOAST ============ */
.overlay{position:fixed;inset:0;background:rgba(6,9,11,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow)}
.modal.wide{max-width:680px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-family:var(--font-display);font-size:16px}
.modal-body{padding:20px}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}
.close-x{background:none;border:none;color:var(--text-dim);font-size:20px;line-height:1;padding:4px}

#toastRoot{position:fixed;top:16px;right:16px;z-index:400;display:flex;flex-direction:column;gap:10px;max-width:320px}
.toast{background:var(--surface-2);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow);animation:slidein .2s ease-out}
.toast.warn{border-left-color:var(--warn)}
.toast.err{border-left-color:var(--danger)}
.toast .tt{font-weight:700;font-size:13px;margin-bottom:2px}
.toast .ts{font-size:12px;color:var(--text-dim)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============ WELCOME / ONBOARD ============ */
.welcome{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.welcome-card{max-width:560px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:44px 34px;box-shadow:var(--shadow)}
.welcome-mark{width:64px;height:64px;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 0 30px var(--accent-glow)}
.welcome-mark svg{width:100%;height:100%}
.welcome h1{font-family:var(--font-display);font-size:24px;margin-bottom:10px}
.welcome p{color:var(--text-dim);margin-bottom:26px;font-size:14px}
.welcome-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.step-dots{display:flex;gap:6px;justify-content:center;margin-bottom:22px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}
.step-dot.active{background:var(--accent);width:20px;border-radius:4px}

/* ============ CALENDAR ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:11px;color:var(--text-dim);font-weight:600;padding-bottom:4px}
.cal-cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);padding:6px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;transition:.1s}
.cal-cell:hover{border-color:var(--accent)}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell .d{font-size:12px;font-weight:600;color:var(--text-dim)}
.cal-cell .dot{width:8px;height:8px;border-radius:50%;align-self:flex-end}
.cal-cell.today{outline:2px solid var(--accent)}

/* ============ MISC ============ */
.divider{height:1px;background:var(--border);margin:16px 0}
.pill-list{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:5px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--text-dim);cursor:pointer;user-select:none}
.pill.on{background:rgba(51,230,160,.14);color:var(--accent);border-color:transparent}
.help-text{font-size:11.5px;color:var(--text-faint);margin-top:5px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-dim)}
.kv .v{font-family:var(--font-mono);font-weight:600}
.warn-box{background:rgba(245,185,66,.1);border:1px solid rgba(245,185,66,.35);color:var(--warn);padding:12px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
.danger-box{background:rgba(255,107,94,.08);border:1px solid rgba(255,107,94,.35);color:var(--danger);padding:12px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px}
.demo-tag{font-size:10px;background:var(--surface-3);color:var(--text-faint);padding:2px 6px;border-radius:5px;margin-left:6px;font-weight:600;letter-spacing:.03em}

@media print{
  .sidebar,.topbar,#toastRoot{display:none !important}
  body{background:#fff;color:#000}
  .content{max-width:100%}
  .payslip-only{display:block !important}
}
.payslip-only{display:none}

/* ============ MOBILE-ONLY WIDGETS ============ */
.mobile-only{display:none}

/* ============ BOTTOM TAB NAV ============ */
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:100;
  background:color-mix(in srgb, var(--bg-2) 92%, transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  justify-content:space-around;align-items:stretch;gap:2px;
}
.bn-btn{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  flex:1;background:transparent;border:none;color:var(--text-dim);font-size:10.5px;font-weight:600;
  padding:7px 4px;border-radius:12px;min-height:48px;
}
.bn-btn svg{width:20px;height:20px}
.bn-btn.active{color:var(--accent);background:var(--surface-2)}

/* ============ RESPONSIVE TABLE -> CARD ============ */
@media(max-width:760px){
  table.responsive-table thead{display:none}
  table.responsive-table, table.responsive-table tbody, table.responsive-table tr, table.responsive-table td{display:block;width:100%}
  table.responsive-table tr{
    border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--surface-2);
  }
  table.responsive-table td{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    border:none;padding:7px 0;white-space:normal;text-align:right;
  }
  table.responsive-table td::before{
    content:attr(data-label);font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-dim);font-weight:600;text-align:left;flex:0 0 auto;
  }
  table.responsive-table td:empty{display:none}
  table.responsive-table td[data-label=""]{display:none}
  table.responsive-table .row-actions-cell{justify-content:flex-end;gap:8px}
  table.responsive-table .row-actions-cell::before{content:none}
}

@media(max-width:900px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;transition:left .2s;box-shadow:var(--shadow);z-index:150}
  .sidebar.open{left:0}
  .menu-btn{display:flex}
  .content{padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
  .topbar{padding:12px 14px}
  .bottom-nav{display:flex}
  .mobile-only{display:block}
  .term-actions .btn{min-width:120px;min-height:52px}
  .icon-btn{width:40px;height:40px}
  .nav-btn{min-height:44px}
  .term-time{font-size:24px}
  .term-greeting{font-size:19px}
  .modal{max-width:100%;width:100%;border-radius:16px 16px 0 0;position:fixed;left:0;right:0;bottom:0;max-height:85vh}
  .overlay{align-items:flex-end;padding:0}
  .terminal{padding:20px 16px}
  .scanner{width:96px;height:96px}
  .grid-4{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:420px){
  .grid-4{grid-template-columns:1fr}
  .term-actions{flex-direction:column}
  .term-actions .btn{width:100%}
}
</style>
</head>
<body>

<div id="toastRoot"></div>
<div id="modalRoot"></div>

<div id="welcomeScreen"></div>

<div class="app hidden" id="appRoot">
  <div class="sidebar" id="sidebar">

    <div class="nav-foot">
      <div id="navFootIdentity" style="margin-bottom:10px"></div>

        <button data-theme-btn="dark">🌙 Dark</button>
        <button data-theme-btn="light">☀️ Light</button>
      </div>

  </div>

  <div class="main">

        <button class="menu-btn" id="menuBtn">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Overview of today's attendance</div>
        </div>

      </div>

    <div class="content" id="viewRoot"></div>
  </div>

  <div class="bottom-nav" id="bottomNav"></div>
</div>

const Store = {
  get(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if(raw===null) return fallback;
      return JSON.parse(raw);
    }catch(e){ return fallback; }
  },
  set(key, val){
    localStorage.setItem(key, JSON.stringify(val));
  },
  employees(){ return this.get(KEYS.employees, []); },
  saveEmployees(v){ this.set(KEYS.employees, v); },
  attendance(){ return this.get(KEYS.attendance, []); },
  saveAttendance(v){ this.set(KEYS.attendance, v); },
  settings(){ return Object.assign({}, DEFAULT_SETTINGS, this.get(KEYS.settings, {})); },
  saveSettings(v){ this.set(KEYS.settings, v); },
  holidays(){ return this.get(KEYS.holidays, []); },

  audit(){ return this.get(KEYS.audit, []); },

  app(){ return Object.assign({}, DEFAULT_APP, this.get(KEYS.app, {})); },
  saveApp(v){ this.set(KEYS.app, v); }
};

function logAudit(action, employeeName, recordId, reason, prev, next){
  const logs = Store.audit();
  const now = new Date();
  logs.unshift({
    id:uid('AUD'), date:fmtDateISO(now), time:fmtTime12(now),
    action, employee:employeeName||'-', recordId:recordId||'-',
    reason:reason||'-', previousValue:prev?JSON.stringify(prev):'-', newValue:next?JSON.stringify(next):'-'
  });
  Store.saveAudit(logs.slice(0,2000));
}

/* ============================================================
   2. UTILITIES
   ============================================================ */
let seqCounter = 0;
function uid(prefix){
  seqCounter++;
  return prefix+'-'+Date.now().toString(36).toUpperCase()+seqCounter.toString(36).toUpperCase();
}
function pad(n){ return n<10?'0'+n:''+n; }
function fmtDateISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('en-US',{year:'numeric', month:'short', day:'numeric'});
}
function fmtTime12(d){
  let h = d.getHours(), m = d.getMinutes(), s = d.getSeconds();
  const ap = h>=12?'PM':'AM';
  h = h%12; if(h===0) h=12;
  return pad(h)+':'+pad(m)+':'+pad(s)+' '+ap;
}
function timeStrTo12(hhmm){
  if(!hhmm) return '--:--';
  const [h,m] = hhmm.split(':').map(Number);
  const ap = h>=12?'PM':'AM';
  let hh = h%12; if(hh===0) hh=12;
  return pad(hh)+':'+pad(m)+' '+ap;
}
function minutesToTimeStr(mins){
  mins = ((mins%1440)+1440)%1440;
  const h = Math.floor(mins/60), m = mins%60;
  return pad(h)+':'+pad(m);
}
function timeStrToMinutes(hhmm){
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}
function dateTimeToMinutes(d){ return d.getHours()*60+d.getMinutes(); }
function minutesToHM(mins){
  mins = Math.round(mins);
  const h = Math.floor(mins/60), m = mins%60;
  if(h<=0) return m+'m';
  return h+'h '+(m>0?m+'m':'');
}
function money(n){
  n = n||0;
  return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:2, maximumFractionDigits:2});
}
function esc(s){
  return (s===undefined||s===null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(title, sub, kind){

/* ============================================================
   3. CENTRALIZED PAYROLL / ATTENDANCE RULES ENGINE
   All calculations reference Store.settings() — never hard-coded.
   ============================================================ */
const Engine = {
  hourlyRate(settings){
    settings = settings || Store.settings();
    return settings.dailySalary / (settings.paidWorkingMinutes/60);
  },

  // Classify + compute a Time In event
  evaluateTimeIn(rawDate, settings){
    settings = settings || Store.settings();
    const rawMins = dateTimeToMinutes(rawDate);
    const earliest = timeStrToMinutes(settings.earliestTimeIn);
    const cutoff = timeStrToMinutes(settings.earlyArrivalCutoff);
    const regularIn = timeStrToMinutes(settings.regularTimeIn);

    let outsideEarliest = rawMins < earliest;
    let officialMins, inStatus;
    if(rawMins <= regularIn){
      officialMins = regularIn;
      inStatus = rawMins < regularIn ? 'Early Arrival' : 'On Time';
    } else {
      officialMins = rawMins;
      inStatus = 'Late';
    }
    return {
      rawMins, officialMins, inStatus, outsideEarliest,
      rawStr: minutesToTimeStr(rawMins), officialStr: minutesToTimeStr(officialMins)
    };
  },

  // Classify + compute a Time Out event
  evaluateTimeOut(rawDate, settings){
    settings = settings || Store.settings();
    const rawMins = dateTimeToMinutes(rawDate);
    const regularOut = timeStrToMinutes(settings.regularTimeOut);
    const latestOut = timeStrToMinutes(settings.latestTimeOut);

    let otMinutes = 0, outStatus, flagged=false;
    if(rawMins <= regularOut){
      outStatus = rawMins < regularOut ? 'Incomplete' : 'On Time';
    } else if(rawMins <= latestOut){
      otMinutes = rawMins - regularOut;
      outStatus = 'Overtime';
    } else {
      otMinutes = rawMins - regularOut;
      outStatus = 'Flagged';
      flagged = true;
    }
    return {
      rawMins, officialMins: rawMins, outStatus, otMinutes, flagged,
      rawStr: minutesToTimeStr(rawMins), officialStr: minutesToTimeStr(rawMins)
    };
  },

  // Full computation once both in & out are known
  computeRecordTotals(record, settings, breakMinutesOverride){
    settings = settings || Store.settings();
    const breakMins = (breakMinutesOverride!==undefined && breakMinutesOverride!==null)
      ? breakMinutesOverride
      : settings.breakMinutes;

    const officialInM = timeStrToMinutes(record.officialTimeIn);
    const officialOutM = timeStrToMinutes(record.officialTimeOut);
    let elapsed = officialOutM - officialInM;
    if(elapsed<0) elapsed = 0;
    let workMinutes = elapsed - breakMins;
    if(workMinutes<0) workMinutes = 0;

    const regularMinutes = Math.min(workMinutes, settings.paidWorkingMinutes);
    const overtimeMinutes = Math.max(record.overtimeMinutesRaw||0, 0);

    const hourlyRate = Engine.hourlyRate(settings);
    const regularPay = hourlyRate * (regularMinutes/60);
    const overtimePay = hourlyRate * settings.otMultiplier * (overtimeMinutes/60);
    const totalPay = regularPay + overtimePay;

    return { breakMinutes:breakMins, regularMinutes, overtimeMinutes, hourlyRate, regularPay, overtimePay, totalPay };
  },

  finalStatus(record){
    if(record.flaggedOut) return 'Flagged';
    if(record.flaggedIn) return 'Flagged';
    if(!record.timeOut) return record.inStatus==='Late' ? 'Late' : 'Working';
    if(record.inStatus==='Late') return 'Late';
    if(record.outStatus==='Incomplete') return 'Incomplete';
    if(record.overtimeMinutes>0) return 'Overtime';
    return 'Present';
  }
};

/* ============================================================
   3B. PASSWORD HASHING (client-side, demo-grade)
   Uses SubtleCrypto PBKDF2 so no plaintext password is ever stored.
   NOTE: this protects only against casual inspection of localStorage —
   it is not a substitute for real server-side authentication. See the
   "Local Demo Mode vs Connected Production Mode" note in Settings.
   ============================================================ */
const Crypto = {
  async hash(password, saltB64){
    const enc = new TextEncoder();
    let salt;
    if(saltB64){
      salt = Uint8Array.from(atob(saltB64), c=>c.charCodeAt(0));
    } else {
      salt = crypto.getRandomValues(new Uint8Array(16));
    }
    const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:100000, hash:'SHA-256'}, keyMaterial, 256);
    const hashB64 = btoa(String.fromCharCode(...new Uint8Array(bits)));
    const saltOut = btoa(String.fromCharCode(...salt));
    return {hash:hashB64, salt:saltOut};
  },
  async verify(password, hashB64, saltB64){
    const {hash} = await this.hash(password, saltB64);
    return hash === hashB64;
  }
};

/* ============================================================
   3C. WEBAUTHN — real device biometric / passkey authentication
   Uses the browser's native navigator.credentials API so the device's
   own secure authenticator (Face ID, Touch ID, Windows Hello, Android
   fingerprint, etc.) performs the actual verification. This app never
   sees or stores a fingerprint/face — only the opaque credential
   response the browser returns.

   IMPORTANT LIMITATION: WebAuthn requires a "secure context" (HTTPS,
   or http://localhost). Opening this file directly as file:// will
   generally NOT satisfy that requirement in most browsers, so
   isAvailable() will correctly report biometrics as unavailable and
   the app falls back to PIN — exactly as the spec requires. Host this
   file over HTTPS (see Settings → Installable App Experience) to use
   real device biometrics.
   ============================================================ */
const WebAuthn = {
  async isAvailable(){
    if(!window.PublicKeyCredential) return false;
    try{
      if(PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable){
        return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      }
      return true;
    }catch(e){ return false; }
  },
  randomChallenge(){ return crypto.getRandomValues(new Uint8Array(32)); },
  deviceLabel(){
    const ua = navigator.userAgent;
    if(/iphone/i.test(ua)) return '📱 iPhone';
    if(/ipad/i.test(ua)) return '📱 iPad';
    if(/android/i.test(ua)) return '📱 Android Device';
    if(/mac os/i.test(ua)) return '💻 Mac';
    if(/windows/i.test(ua)) return '💻 Windows PC';
    return '💻 This Device';
  },
  async register(employee){
    const challenge = this.randomChallenge();
    const userId = new TextEncoder().encode(employee.id);
    const cred = await navigator.credentials.create({
      publicKey:{
        challenge,
        rp:{ name:'AttendX Biometric Terminal' },
        user:{ id:userId, name:employee.employeeId, displayName:employee.name },
        pubKeyCredParams:[{type:'public-key', alg:-7}, {type:'public-key', alg:-257}],
        authenticatorSelection:{ userVerification:'required', authenticatorAttachment:'platform' },
        timeout:60000,
        attestation:'none'
      }
    });
    if(!cred) throw new Error('No credential returned');
    const idB64 = btoa(String.fromCharCode(...new Uint8Array(cred.rawId)));
    return { credentialId:idB64, device:this.deviceLabel(), registeredAt:new Date().toISOString() };
  },
  async authenticate(passkeys){
    const challenge = this.randomChallenge();
    const allow = (passkeys||[]).map(p=>({ type:'public-key', id:Uint8Array.from(atob(p.credentialId), c=>c.charCodeAt(0)) }));
    const assertion = await navigator.credentials.get({
      publicKey:{ challenge, allowCredentials:allow.length?allow:undefined, userVerification:'required', timeout:60000 }
    });
    if(!assertion) throw new Error('No assertion returned');
    return true;
  }
};

    else {
      bnav.style.display='';
      // Primary mobile tabs: Home, Attendance, Payroll, More (More opens the full nav drawer)
      const isMoreActive = !['dashboard','attendance','payroll'].includes(State.view);
      bnav.innerHTML = BOTTOM_NAV_ITEMS.map(it=>{
        const active = it.id==='more' ? isMoreActive : State.view===it.id;
        return '<button class="bn-btn'+(active?' active':'')+'" data-bnav="'+it.id+'">'+it.icon+'<span>'+it.label+'</span></button>';
      }).join('');
      bnav.querySelectorAll('[data-bnav]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          if(btn.dataset.bnav==='more'){
            document.getElementById('sidebar').classList.toggle('open');
          } else {
            document.getElementById('sidebar').classList.remove('open');
            setView(btn.dataset.bnav);
          }
        });
      });
    }
  }
}
function setView(v){
  State.view = v;
  const items = State.role==='admin' ? NAV_ITEMS : EMPLOYEE_NAV_ITEMS;
  const match = items.find(n=>n.id===v) || items[0];
  State.view = match.id;
  document.getElementById('pageTitle').textContent = match.label;
  document.getElementById('pageSub').textContent = NAV_SUB[match.id];
  renderNav();
  renderView();
}

  const root = document.getElementById('viewRoot');

    dashboard:renderDashboard, attendance:renderAttendance, employees:renderEmployees,
    payroll:renderPayroll, calendar:renderCalendar, leave:renderLeave, audit:renderAudit, settings:renderSettings
  };
  root.innerHTML = renderers[State.view]();
  bindViewEvents();
}

   8. DASHBOARD

function renderDashboard(){
  const employees = Store.employees();
  const today = fmtDateISO(new Date());
  const settings = Store.settings();
  const todays = Store.attendance().filter(r=>r.date===today);
  const present = todays.filter(r=>['Present','Working','Overtime','Late'].includes(r.status)).length;
  const late = todays.filter(r=>r.status==='Late').length;
  const working = todays.filter(r=>!r.timeOut).length;
  const completed = todays.filter(r=>r.timeOut).length;
  const overtime = todays.filter(r=>(r.overtimeMinutes||0)>0).length;
  const activeEmployees = employees.filter(e=>e.status==='Active').length;
  const absent = Math.max(activeEmployees - todays.length, 0);
  const todaysPayroll = todays.reduce((a,r)=>a+(r.totalPay||0),0);

  const now = new Date();

function renderFilteredAttendanceTable(){
  let recs = Store.attendance().slice().sort((a,b)=> (b.date+b.rawTimeIn).localeCompare(a.date+a.rawTimeIn));
  const f = State.attFilters;
  if(f.employee) recs = recs.filter(r=>r.employeeId===f.employee);
  if(f.status) recs = recs.filter(r=>r.status===f.status);
  if(f.month) recs = recs.filter(r=>r.date.startsWith(f.month));
  if(f.q){

    recs = recs.filter(r=> (r.employeeName||'').toLowerCase().includes(q) || (r.employeeCode||'').toLowerCase().includes(q) || (r.status||'').toLowerCase().includes(q));

function startVerification(){

  if(emp.pin){

  scanner.classList.add('scanning');

  clearTimeout(State.scanTimer);
  State.scanTimer = setTimeout(()=>{

    scanner.classList.add('verified');

  }, 1200);
}

function doTimeIn(){
  const emp = getEmployee(State.selectedEmployeeId);
  if(!emp){ toast('Employee not selected.', '', 'err'); return; }
  if(!State.verified){ toast('Please verify identity first.', '', 'err'); return; }
  if(todaysOpenRecord(emp.id)){ toast('Already clocked in today.', '', 'err'); return; }
  const existing = todaysRecord(emp.id);
  if(existing && existing.timeOut){ toast('Already clocked out today.', 'Time in/out already completed for today.', 'err'); return; }

  const settings = Store.settings();
  const now = new Date();
  const evalIn = Engine.evaluateTimeIn(now, settings);

  const finish = (accepted)=>{
    const record = {
      id: uid('ATT'),
      employeeId: emp.id,
      employeeName: emp.name,
      employeeCode: emp.employeeId,
      date: fmtDateISO(now),
      rawTimeIn: evalIn.rawStr,
      officialTimeIn: evalIn.officialStr,
      inStatus: evalIn.inStatus,
      flaggedIn: evalIn.outsideEarliest && !accepted ? true : (evalIn.outsideEarliest ? true : false),
      timeOut:false,
      rawTimeOut:null, officialTimeOut:null, outStatus:null, flaggedOut:false,
      overtimeMinutesRaw:0, breakMinutes:settings.breakMinutes,
      regularMinutes:0, overtimeMinutes:0, regularPay:0, overtimePay:0, totalPay:0,
      status:'Working', notes:'', demo:false,
      createdAt:now.toISOString(), updatedAt:now.toISOString()
    };
    record.status = evalIn.inStatus==='Late' ? 'Late' : 'Working';
    const all = Store.attendance();
    all.push(record);
    Store.saveAttendance(all);
    logAudit('Time In', emp.name, record.id, '-', null, {rawTimeIn:record.rawTimeIn, officialTimeIn:record.officialTimeIn});
    if(evalIn.inStatus==='Late'){
      toast('⚠ Late Arrival', 'Time In: '+timeStrTo12(evalIn.rawStr), 'warn');
    } else {
      toast('✓ Attendance Recorded', 'Time In: '+timeStrTo12(evalIn.officialStr));
    }
    State.verified = false;
    renderView();
    showTimeInSuccess(record);
  };

  if(evalIn.outsideEarliest){
    confirmDialog(
      'Attendance outside accepted earliest time.',
      'Raw time '+timeStrTo12(evalIn.rawStr)+' is earlier than the configured earliest time-in ('+timeStrTo12(settings.earliestTimeIn)+'). Accept this record and flag it for review, or cancel.',
      ()=>finish(true)
    );
  } else {
    finish(true);
  }
}

function doTimeOut(){
  const emp = getEmployee(State.selectedEmployeeId);
  if(!emp){ toast('Employee not selected.', '', 'err'); return; }
  if(!State.verified){ toast('Please verify identity first.', '', 'err'); return; }
  const open = todaysOpenRecord(emp.id);
  if(!open){ toast('Please complete Time In before recording Time Out.', '', 'err'); return; }

  const settings = Store.settings();
  const now = new Date();
  const evalOut = Engine.evaluateTimeOut(now, settings);

  const finish = ()=>{
    const all = Store.attendance();
    const idx = all.findIndex(r=>r.id===open.id);
    const rec = all[idx];
    rec.rawTimeOut = evalOut.rawStr;
    rec.officialTimeOut = evalOut.officialStr;
    rec.outStatus = evalOut.outStatus;
    rec.flaggedOut = evalOut.flagged;
    rec.overtimeMinutesRaw = evalOut.otMinutes;
    rec.timeOut = true;

    const totals = Engine.computeRecordTotals(rec, settings);
    Object.assign(rec, totals);
    rec.status = Engine.finalStatus(rec);
    rec.updatedAt = now.toISOString();
    all[idx] = rec;
    Store.saveAttendance(all);
    logAudit('Time Out', emp.name, rec.id, '-', null, {rawTimeOut:rec.rawTimeOut, overtimeMinutes:rec.overtimeMinutes});

    if(evalOut.flagged){
      toast('Clock-out is outside the normal accepted window.', 'Flagged for admin review.', 'warn');
    } else if(evalOut.otMinutes>0){
      toast('✓ Time Out Recorded', 'Overtime: '+minutesToHM(evalOut.otMinutes));
    } else {
      toast('✓ Time Out Recorded', 'Time Out: '+timeStrTo12(evalOut.officialStr));
    }
    State.verified = false;
    renderView();
    showTimeOutSuccess(rec, settings);
  };

  if(evalOut.flagged){
    confirmDialog(
      'Clock-out is outside the normal accepted window.',
      'Raw time '+timeStrTo12(evalOut.rawStr)+' is later than the latest accepted time-out ('+timeStrTo12(settings.latestTimeOut)+'). This record will be saved and flagged for review.',
      finish
    );
  } else {
    finish();
  }
}

function tickLiveWork(){
  if(State.view!=='attendance' || !State.selectedEmployeeId) return;
  const open = todaysOpenRecord(State.selectedEmployeeId);
  const el = document.getElementById('liveWorkTime');
  if(!el) return;
  if(open){
    const [h,m] = open.officialTimeIn.split(':').map(Number);
    const start = new Date(); start.setHours(h,m,0,0);
    let diff = Math.max(0, Math.floor((Date.now()-start.getTime())/1000));
    const hh = pad(Math.floor(diff/3600)), mm = pad(Math.floor((diff%3600)/60)), ss = pad(diff%60);
    el.textContent = hh+':'+mm+':'+ss;
  }
}

    const name = document.getElementById('fName').value.trim();
    const empId = document.getElementById('fEmpId').value.trim();
    const pin = document.getElementById('fPin').value.trim();
    const status = document.getElementById('fStatus').value;
    if(!name || !empId){ toast('Name and Employee ID are required.', '', 'err'); return; }
    const employees = Store.employees();
    const dup = employees.find(e=> e.employeeId.toLowerCase()===empId.toLowerCase() && (!existing || e.id!==existing.id));
    if(dup){ toast('Duplicate Employee ID.', 'Please use a unique Employee ID.', 'err'); return; }
    const dupName = employees.find(e=> e.name.toLowerCase()===name.toLowerCase() && (!existing || e.id!==existing.id));
    if(dupName){ toast('Duplicate employee name.', 'An employee with this name already exists.', 'warn'); }

    if(isEdit){
      const idx = employees.findIndex(e=>e.id===existing.id);
      const prev = Object.assign({}, employees[idx]);
      employees[idx] = Object.assign({}, employees[idx], {name, employeeId:empId, pin, status});
      Store.saveEmployees(employees);
      logAudit('Employee Modified', name, existing.id, '-', prev, employees[idx]);
      toast('Employee updated', name);
    } else {
      const rec = {id:uid('EMP'), name, employeeId:empId, pin, status, dateRegistered:fmtDateISO(new Date()), demo:false};
      employees.push(rec);
      Store.saveEmployees(employees);
      logAudit('Employee Registered', name, rec.id, '-', null, rec);
      toast('Employee registered', name);
    }
    closeModal();
    renderView();
  });
}

function correctionModal(record){
  openModal(`

    <div class="modal-body">
      <div class="warn-box">Raw timestamps are always preserved. Corrections are recorded in the audit log.</div>

      <div class="kv"><span class="k">Date</span><span class="v">${fmtDateShort(record.date)}</span></div>
      <div class="kv"><span class="k">Raw In / Raw Out</span><span class="v">${record.rawTimeIn?timeStrTo12(record.rawTimeIn):'—'} / ${record.rawTimeOut?timeStrTo12(record.rawTimeOut):'—'}</span></div>
      <div class="divider"></div>
      <div class="field"><label>Official Time In</label><input type="time" id="cTimeIn" value="${record.officialTimeIn||''}"></div>
      <div class="field"><label>Official Time Out</label><input type="time" id="cTimeOut" value="${record.officialTimeOut||''}"></div>
      <div class="field"><label>Break (minutes)</label><input type="number" id="cBreak" value="${record.breakMinutes!==undefined?record.breakMinutes:60}" min="0"></div>
      <div class="field"><label>Status</label>
        <select id="cStatus">${['Present','Late','Overtime','Incomplete','Flagged','Leave','Rest Day'].map(s=>'<option '+(record.status===s?'selected':'')+'>'+s+'</option>').join('')}</select>
      </div>
      <div class="field"><label>Correction Reason (required)</label><textarea id="cReason" rows="2" placeholder="e.g. Forgot to clock out."></textarea></div>
      <div class="field"><label>Notes</label><textarea id="cNotes" rows="2">${esc(record.notes||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" id="saveCorrectionBtn">Save Correction</button></div>
  `);
  document.getElementById('saveCorrectionBtn').addEventListener('click', ()=>{
    const reason = document.getElementById('cReason').value.trim();
    if(!reason){ toast('Correction reason is required.', '', 'err'); return; }
    requireAdminPin(()=>{
      const settings = Store.settings();
      const all = Store.attendance();
      const idx = all.findIndex(r=>r.id===record.id);
      const prev = Object.assign({}, all[idx]);
      const rec = all[idx];
      rec.officialTimeIn = document.getElementById('cTimeIn').value || rec.officialTimeIn;
      rec.officialTimeOut = document.getElementById('cTimeOut').value || rec.officialTimeOut;
      const breakMins = Number(document.getElementById('cBreak').value)||0;
      rec.timeOut = !!rec.officialTimeOut;
      if(rec.timeOut){
        const regOutM = timeStrToMinutes(settings.regularTimeOut);
        const outM = timeStrToMinutes(rec.officialTimeOut);
        rec.overtimeMinutesRaw = Math.max(outM-regOutM, 0);
        const totals = Engine.computeRecordTotals(rec, settings, breakMins);
        Object.assign(rec, totals);
      }
      rec.status = document.getElementById('cStatus').value;
      rec.notes = document.getElementById('cNotes').value.trim();
      rec.updatedAt = new Date().toISOString();
      all[idx] = rec;
      Store.saveAttendance(all);
      logAudit('Attendance Modified', rec.employeeName, rec.id, reason, prev, rec);
      toast('Attendance corrected', reason);
      closeModal();
      renderView();
    });
  });
}

function renderCalendar(){
  const employees = Store.employees();
  const empId = State.calEmployeeId;
  const year = State.calYear, month = State.calMonth;
  const recs = monthRecords(year, month, empId==='all'?null:empId);
  const recByDate = {};
  recs.forEach(r=>{ recByDate[r.date] = recByDate[r.date]||[]; recByDate[r.date].push(r); });
  const holidays = Store.holidays().filter(h=>h.date.startsWith(year+'-'+pad(month+1)));
  const holByDate = {}; holidays.forEach(h=>holByDate[h.date]=h);

  const firstDay = new Date(year,month,1).getDay();
  const daysInMonth = new Date(year,month+1,0).getDate();
  const todayIso = fmtDateISO(new Date());
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const settings = Store.settings();

  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const iso = year+'-'+pad(month+1)+'-'+pad(d);
    const dayRecs = recByDate[iso]||[];
    const isRest = !settings.workdays.includes(new Date(iso+'T00:00:00').getDay());
    const hol = holByDate[iso];
    let dotColor = 'transparent';
    if(hol) dotColor = 'var(--leave)';
    else if(dayRecs.length){
      const st = dayRecs[0].status;
      dotColor = st==='Late'?'var(--warn)':st==='Overtime'?'var(--leave)':(st==='Flagged'||st==='Incomplete')?'var(--danger)':'var(--accent)';
    } else if(isRest) dotColor = 'var(--rest)';
    cells += `<div class="cal-cell${iso===todayIso?' today':''}" data-cal-day="${iso}">
      <div class="d">${d}</div>
      <div class="dot" style="background:${dotColor}"></div>
    </div>`;
  }

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="row-gap" style="margin-bottom:16px">
      <select id="calEmployee" style="width:auto;min-width:170px">
        <option value="all"${empId==='all'?' selected':''}>All Employees</option>
        ${employees.map(e=>'<option value="'+e.id+'"'+(e.id===empId?' selected':'')+'>'+esc(e.name)+'</option>').join('')}
      </select>
      <div class="row-gap" style="margin-left:auto">
        <button class="icon-btn" id="calPrev">←</button>
        <div class="section-title" style="margin:0;min-width:150px;text-align:center">${new Date(year,month,1).toLocaleDateString('en-US',{month:'long', year:'numeric'})}</div>
        <button class="icon-btn" id="calNext">→</button>
      </div>
    </div>
    <div class="cal-grid" style="margin-bottom:6px">${dows.map(d=>'<div class="cal-dow">'+d+'</div>').join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="pill-list" style="margin-top:16px">
      <span class="pill">🟢 Present</span><span class="pill">🟡 Late</span><span class="pill">🟣 Overtime</span>
      <span class="pill">🔵 Holiday/Leave</span><span class="pill">⚪ Rest Day</span><span class="pill">🟠 Incomplete/Flagged</span>
    </div>
  </div>
  <div class="card">
    <div class="section-title">Holiday Settings</div>
    <div class="section-desc">Holidays are shown separately on the calendar.</div>
    <div class="row-gap" style="margin-bottom:14px">
      <input type="text" id="holName" placeholder="Holiday name" style="max-width:200px">
      <input type="date" id="holDate" style="max-width:170px">
      <select id="holType" style="max-width:200px"><option>Regular Holiday</option><option>Special Non-Working Holiday</option><option>Optional Holiday</option></select>
      <button class="btn btn-primary btn-sm" id="addHolBtn">+ Add Holiday</button>
    </div>
    ${renderHolidayTable()}
  </div>
  `;
}

function exportBackup(){
  const data = {
    version:1, exportedAt:new Date().toISOString(),
    employees:Store.employees(), attendanceRecords:Store.attendance(), attendanceSettings:Store.settings(),
    holidays:Store.holidays(), leaveRecords:Store.leave(), auditLogs:Store.audit(), appSettings:Store.app()
  };
  downloadFile('attendance-backup-'+fmtDateISO(new Date())+'.json', JSON.stringify(data,null,2), 'application/json');
  toast('Backup exported');
}
function importBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data || !Array.isArray(data.employees) || !Array.isArray(data.attendanceRecords)){
        toast('Invalid backup file.', 'Missing required fields.', 'err'); return;
      }
      Store.saveEmployees(data.employees||[]);
      Store.saveAttendance(data.attendanceRecords||[]);
      Store.saveSettings(Object.assign({}, DEFAULT_SETTINGS, data.attendanceSettings||{}));
      Store.saveHolidays(data.holidays||[]);
      Store.saveLeave(data.leaveRecords||[]);
      Store.saveAudit(data.auditLogs||[]);
      Store.saveApp(Object.assign({}, DEFAULT_APP, data.appSettings||{}));
      toast('Backup imported successfully');
      applyTheme();
      boot();
    }catch(e){
      toast('Invalid backup file.', 'Could not parse JSON.', 'err');
    }
  };
  reader.readAsText(file);
}
function exportCsv(){
  const recs = Store.attendance();
  const headers = ['Date','Employee','EmployeeID','RawIn','OfficialIn','RawOut','OfficialOut','BreakMinutes','RegularHours','OvertimeMinutes','RegularPay','OvertimePay','TotalPay','Status','Notes'];
  const rows = recs.map(r=>[r.date,r.employeeName,r.employeeCode,r.rawTimeIn,r.officialTimeIn,r.rawTimeOut,r.officialTimeOut,r.breakMinutes,((r.regularMinutes||0)/60).toFixed(2),r.overtimeMinutes||0,(r.regularPay||0).toFixed(2),(r.overtimePay||0).toFixed(2),(r.totalPay||0).toFixed(2),r.status,r.notes||'']);
  const csv = [headers.join(','), ...rows.map(row=>row.map(v=>'"'+String(v===undefined||v===null?'':v).replace(/"/g,'""')+'"').join(','))].join('\n');
  downloadFile('attendance-export-'+fmtDateISO(new Date())+'.csv', csv, 'text/csv');
  toast('CSV exported');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function loadDemoData(){
  const employees = Store.employees();
  if(employees.some(e=>e.demo)){ toast('Demo data already loaded.'); return; }
  const settings = Store.settings();
  const demoEmp = {id:uid('EMP'), name:'Maria Santos (Demo)', employeeId:'DEMO-001', pin:'', status:'Active', dateRegistered:fmtDateISO(new Date()), demo:true};
  employees.push(demoEmp);
  Store.saveEmployees(employees);

  const all = Store.attendance();
  const today = new Date();
  const patterns = [
    {inH:7,inM:20,outH:17,outM:0}, {inH:8,inM:0,outH:17,outM:0}, {inH:8,inM:17,outH:17,outM:5},
    {inH:7,inM:45,outH:17,outM:30}, {inH:8,inM:5,outH:17,outM:0}, {inH:7,inM:5,outH:16,outM:55},
    {inH:8,inM:0,outH:17,outM:40}, {inH:7,inM:30,outH:17,outM:0}, {inH:8,inM:22,outH:17,outM:0},
    {inH:8,inM:0,outH:17,outM:15}
  ];
  for(let i=0;i<10;i++){
    const d = new Date(today); d.setDate(d.getDate()-i-1);
    const dow = d.getDay();
    if(!settings.workdays.includes(dow)) continue;
    const p = patterns[i%patterns.length];
    const rawIn = new Date(d); rawIn.setHours(p.inH,p.inM,0,0);
    const rawOut = new Date(d); rawOut.setHours(p.outH,p.outM,0,0);
    const evalIn = Engine.evaluateTimeIn(rawIn, settings);
    const evalOut = Engine.evaluateTimeOut(rawOut, settings);
    const rec = {
      id:uid('ATT'), employeeId:demoEmp.id, employeeName:demoEmp.name, employeeCode:demoEmp.employeeId,
      date:fmtDateISO(d), rawTimeIn:evalIn.rawStr, officialTimeIn:evalIn.officialStr, inStatus:evalIn.inStatus, flaggedIn:evalIn.outsideEarliest,
      timeOut:true, rawTimeOut:evalOut.rawStr, officialTimeOut:evalOut.officialStr, outStatus:evalOut.outStatus, flaggedOut:evalOut.flagged,
      overtimeMinutesRaw:evalOut.otMinutes, breakMinutes:settings.breakMinutes,
      notes:'', demo:true, createdAt:d.toISOString(), updatedAt:d.toISOString()
    };
    const totals = Engine.computeRecordTotals(rec, settings);
    Object.assign(rec, totals);
    rec.status = Engine.finalStatus(rec);
    all.push(rec);
  }
  Store.saveAttendance(all);
  toast('Demo data loaded', '10 sample attendance records added.');
  renderView();
}
function removeDemoData(){
  Store.saveEmployees(Store.employees().filter(e=>!e.demo));
  Store.saveAttendance(Store.attendance().filter(r=>!r.demo));
  toast('Demo data removed');
  renderView();
}

function seedInitialData(){
  const app = Store.app();
  if(app.seeded) return;
  const settings = Store.settings();

  const employees = Store.employees();
  const seedEmp = {
    id: uid('EMP'),
    name: 'Employee Name — Edit Required',
    employeeId: 'EMP-001',
    photo: EMPLOYEE_SEED_PHOTO,
    position: 'Position — Edit Required',
    department: 'Department — Edit Required',
    pin:'', passkeys:[],
    status:'Active', dateRegistered: HISTORICAL_SEED[0].date, demo:false
  };
  employees.push(seedEmp);
  Store.saveEmployees(employees);

  const all = Store.attendance();
  HISTORICAL_SEED.forEach(h=>{
    const [ih, im] = h.rawIn.split(':').map(Number);
    const [oh, om] = h.rawOut.split(':').map(Number);
    const dIn = new Date(h.date+'T00:00:00'); dIn.setHours(ih, im, 0, 0);
    const dOut = new Date(h.date+'T00:00:00'); dOut.setHours(oh, om, 0, 0);
    const evalIn = Engine.evaluateTimeIn(dIn, settings);
    const evalOut = Engine.evaluateTimeOut(dOut, settings);
    const rec = {
      id: uid('ATT'), employeeId: seedEmp.id, employeeName: seedEmp.name, employeeCode: seedEmp.employeeId,
      date: h.date, rawTimeIn: evalIn.rawStr, officialTimeIn: evalIn.officialStr, inStatus: evalIn.inStatus, flaggedIn: evalIn.outsideEarliest,
      timeOut:true, rawTimeOut: evalOut.rawStr, officialTimeOut: evalOut.officialStr, outStatus: evalOut.outStatus, flaggedOut: evalOut.flagged,
      overtimeMinutesRaw: evalOut.otMinutes, breakMinutes: settings.breakMinutes,
      notes:'', demo:false, historical:true,
      createdAt: dIn.toISOString(), updatedAt: dOut.toISOString()
    };
    const totals = Engine.computeRecordTotals(rec, settings);
    Object.assign(rec, totals);
    rec.status = Engine.finalStatus(rec);
    all.push(rec);
  });
  Store.saveAttendance(all);

  app.seeded = true;
  Store.saveApp(app);
}

/* ============================================================
   25. ADMIN LOGIN
   ============================================================ */
function renderLogin(){
  const el = document.getElementById('welcomeScreen');
  el.innerHTML = `
  <div class="welcome">
    <div class="welcome-card">
      <div class="welcome-mark">${logoMark()}</div>
      <h1 style="margin-bottom:2px">Employee Attendance System</h1>
      <p style="margin-bottom:22px">Admin Login</p>
      <div class="field" style="text-align:left"><label>Username / Email</label><input id="loginUser" placeholder="admin@company.com" autocomplete="username"></div>
      <div class="field" style="text-align:left"><label>Password</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block btn-lg" id="loginBtn">LOGIN</button>
      <button class="btn btn-block" id="loginBioBtn" style="margin-top:10px">🔒 Use Device Biometric</button>
      <div class="divider"></div>
      <p style="margin-bottom:14px">Clocking in for a shift?</p>
      <button class="btn btn-block" id="employeeModeBtn">👤 Continue as Employee →</button>
    </div>
  </div>`;
  el.classList.remove('hidden');

  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const user = document.getElementById('loginUser').value.trim();
    const pass = document.getElementById('loginPass').value;
    const app = Store.app();
    if(!app.admin){ toast('No administrator account exists yet.', '', 'err'); return; }
    if(user.toLowerCase() !== app.admin.username.toLowerCase()){ toast('Invalid username or password.', '', 'err'); return; }
    const ok = await Crypto.verify(pass, app.admin.passwordHash, app.admin.salt);
    if(!ok){ toast('Invalid username or password.', '', 'err'); return; }
    logAudit('Admin Login', app.admin.name, '-', 'Password login', null, null);
    enterApp('admin');
  });

  document.getElementById('loginBioBtn').addEventListener('click', async ()=>{
    const app = Store.app();
    if(!app.admin || !app.admin.passkeys || !app.admin.passkeys.length){
      toast('No device biometric registered for this admin account.', 'Log in with a password, then register one in Settings.', 'warn'); return;
    }
    const available = await WebAuthn.isAvailable();
    if(!available){ toast('Biometric authentication is unavailable on this device.', '', 'err'); return; }
    try{
      await WebAuthn.authenticate(app.admin.passkeys);
      logAudit('Admin Login', app.admin.name, '-', 'Device biometric login', null, null);
      enterApp('admin');
    }catch(e){
      toast('Biometric verification failed or was cancelled.', '', 'err');
    }
  });

  document.getElementById('employeeModeBtn').addEventListener('click', ()=>{
    State.role = 'employee';
    enterApp('employee');
  });
}

/* ============================================================
   26. FIRST-RUN SETUP WIZARD (Admin → Attendance Config → Employee → Finish)
   ============================================================ */
function setupWizard(step){
  step = step||1;
  const s = Store.settings();
  const employees = Store.employees();
  const seedEmp = employees[0] || null;

  const dots = active => '<div class="step-dots">'+[1,2,3,4].map(i=>'<div class="step-dot'+(i===active?' active':'')+'"></div>').join('')+'</div>';

  const bodyByStep = {
    1: `
      ${dots(1)}
      <div class="welcome-mark" style="width:52px;height:52px;border-radius:14px">${logoMark()}</div>
      <h1 style="font-size:19px">Welcome — System Setup</h1>
      <p style="margin-bottom:18px">Step 1 of 4 — Create the administrator account.</p>
      <div class="field" style="text-align:left"><label>Admin Name</label><input id="wAdminName" placeholder="Juan Dela Cruz"></div>
      <div class="field" style="text-align:left"><label>Username / Email</label><input id="wAdminUser" placeholder="admin@company.com"></div>
      <div class="field" style="text-align:left"><label>Password</label><input id="wAdminPass" type="password" placeholder="At least 6 characters"></div>
      <div class="field" style="text-align:left"><label>Confirm Password</label><input id="wAdminPass2" type="password" placeholder="Re-enter password"></div>
    `,
    2: `
      ${dots(2)}
      <h1 style="font-size:19px">Configure Attendance</h1>
      <p style="margin-bottom:18px">Step 2 of 4 — These rules drive every calculation and can be changed later in Settings.</p>
      <div class="grid grid-2" style="text-align:left">
        <div class="field"><label>Regular Time In</label><input id="wRegIn" type="time" value="${s.regularTimeIn}"></div>
        <div class="field"><label>Regular Time Out</label><input id="wRegOut" type="time" value="${s.regularTimeOut}"></div>
        <div class="field"><label>Earliest Time In</label><input id="wEarliest" type="time" value="${s.earliestTimeIn}"></div>
        <div class="field"><label>Latest Time Out</label><input id="wLatest" type="time" value="${s.latestTimeOut}"></div>
        <div class="field"><label>Break Duration (min)</label><input id="wBreak" type="number" value="${s.breakMinutes}"></div>
        <div class="field"><label>Daily Salary (₱)</label><input id="wSalary" type="number" value="${s.dailySalary}"></div>
        <div class="field"><label>Overtime Multiplier</label><input id="wOtMult" type="number" step="0.05" value="${s.otMultiplier}"></div>
      </div>
    `,
    3: `
      ${dots(3)}
      <h1 style="font-size:19px">Confirm First Employee</h1>
      <p style="margin-bottom:16px">Step 3 of 4 — Edit these details now, or update them anytime from Employees.</p>
      ${seedEmp?`<img src="${seedEmp.photo||''}" alt="" style="width:88px;height:88px;border-radius:16px;object-fit:cover;margin-bottom:14px;border:1px solid var(--border)">`:''}
      <div class="field" style="text-align:left"><label>Employee Name</label><input id="wEmpName" value="${esc(seedEmp?seedEmp.name:'')}"></div>
      <div class="field" style="text-align:left"><label>Employee ID</label><input id="wEmpId" value="${esc(seedEmp?seedEmp.employeeId:'')}"></div>
      <div class="field" style="text-align:left"><label>PIN (optional)</label><input id="wEmpPin" placeholder="4-digit PIN" value="${esc(seedEmp?seedEmp.pin:'')}"></div>
      <button class="btn btn-block" id="wRegisterBio" type="button" style="margin-top:4px">🔒 Register Device Biometric</button>
      <div class="help-text" id="wBioStatus"></div>
    `,
    4: `
      ${dots(4)}
      <div class="success-check" style="margin:0 auto 16px">${successIcon()}</div>
      <h1 style="font-size:19px">Setup Complete ✓</h1>
      <p style="margin-bottom:18px">Your administrator account, attendance rules, and first employee are ready to go.</p>
    `
  };
  document.getElementById('welcomeScreen').innerHTML = `<div class="welcome"><div class="welcome-card">${bodyByStep[step]}
    <div class="welcome-actions" style="margin-top:18px">
      ${step>1 && step<4 ?'<button class="btn" id="wBack">Back</button>':''}
      <button class="btn btn-primary" id="wNext">${step<3?'Continue':(step===3?'Continue':'Enter Admin Dashboard')}</button>
    </div>
  </div></div>`;
  if(step>1 && step<4) document.getElementById('wBack').addEventListener('click', ()=>setupWizard(step-1));

  if(step===3){
    document.getElementById('wRegisterBio').addEventListener('click', async ()=>{
      const statusEl = document.getElementById('wBioStatus');
      const available = await WebAuthn.isAvailable();
      if(!available){ statusEl.textContent = 'Biometric authentication is unavailable on this device. You can use a PIN instead.'; return; }
      try{
        const empNow = Store.employees().find(e=>e.id===seedEmp.id);
        const passkey = await WebAuthn.register(empNow);
        const list = Store.employees();
        const idx = list.findIndex(e=>e.id===seedEmp.id);
        list[idx].passkeys = (list[idx].passkeys||[]).concat(passkey);
        Store.saveEmployees(list);
        logAudit('Biometric Credential Registered', list[idx].name, list[idx].id, 'Setup wizard', null, {device:passkey.device});
        statusEl.textContent = '✓ Registered on ' + passkey.device + '.';
      }catch(e){
        statusEl.textContent = 'Registration failed or was cancelled.';
      }
    });
  }

  document.getElementById('wNext').addEventListener('click', async ()=>{
    if(step===1){
      const name = document.getElementById('wAdminName').value.trim();
      const user = document.getElementById('wAdminUser').value.trim();
      const pass = document.getElementById('wAdminPass').value;
      const pass2 = document.getElementById('wAdminPass2').value;
      if(!name || !user || !pass){ toast('Please complete all administrator fields.', '', 'err'); return; }
      if(pass.length<6){ toast('Password must be at least 6 characters.', '', 'err'); return; }
      if(pass!==pass2){ toast('Passwords do not match.', '', 'err'); return; }
      const {hash, salt} = await Crypto.hash(pass);
      const app = Store.app();
      app.admin = {name, username:user, passwordHash:hash, salt, passkeys:[]};
      Store.saveApp(app);
      setupWizard(2);
    } else if(step===2){
      const s2 = Store.settings();
      s2.regularTimeIn = document.getElementById('wRegIn').value || s2.regularTimeIn;
      s2.regularTimeOut = document.getElementById('wRegOut').value || s2.regularTimeOut;
      s2.earliestTimeIn = document.getElementById('wEarliest').value || s2.earliestTimeIn;
      s2.latestTimeOut = document.getElementById('wLatest').value || s2.latestTimeOut;
      s2.breakMinutes = Number(document.getElementById('wBreak').value)||s2.breakMinutes;
      s2.dailySalary = Number(document.getElementById('wSalary').value)||s2.dailySalary;
      s2.otMultiplier = Number(document.getElementById('wOtMult').value)||s2.otMultiplier;
      Store.saveSettings(s2);
      setupWizard(3);
    } else if(step===3){
      if(seedEmp){
        const list = Store.employees();
        const idx = list.findIndex(e=>e.id===seedEmp.id);
        const prev = Object.assign({}, list[idx]);
        list[idx].name = document.getElementById('wEmpName').value.trim() || list[idx].name;
        list[idx].employeeId = document.getElementById('wEmpId').value.trim() || list[idx].employeeId;
        list[idx].pin = document.getElementById('wEmpPin').value.trim();
        Store.saveEmployees(list);
        logAudit('Employee Modified', list[idx].name, list[idx].id, 'Setup wizard', prev, list[idx]);
        // keep attendance records' cached name/code in sync
        const all = Store.attendance();
        all.forEach(r=>{ if(r.employeeId===list[idx].id){ r.employeeName=list[idx].name; r.employeeCode=list[idx].employeeId; } });
        Store.saveAttendance(all);
      }
      setupWizard(4);
    } else {
      const app2 = Store.app();
      app2.setupDone = true;
      Store.saveApp(app2);
      enterApp('admin');
    }
  });
}

/* ============================================================
   27. ENTER APP / LOGOUT
   ============================================================ */
function enterApp(role){
  State.role = role;
  document.getElementById('welcomeScreen').classList.add('hidden');
  document.getElementById('welcomeScreen').innerHTML = '';
  document.getElementById('appRoot').classList.remove('hidden');
  const app = Store.app();
  State.selectedEmployeeId = app.lastEmployeeId || null;
  setView(role==='admin' ? 'dashboard' : 'attendance');
}
function logout(){
  State.role = null;
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('appRoot').classList.add('hidden');
  renderLogin();
}

/* ============================================================
   28. BOOT
   ============================================================ */
function boot(){
  applyTheme();
  seedInitialData();
  const app = Store.app();
  if(!app.setupDone || !app.admin){
    setupWizard(1);
  } else {
    document.getElementById('appRoot').classList.add('hidden');
    renderLogin();
  }
  clearInterval(State.clockTimer);
  State.clockTimer = setInterval(tickClock, 1000);
}

document.getElementById('menuBtn').addEventListener('click', ()=>document.getElementById('sidebar').classList.toggle('open'));

boot();
})();
</script>
</body>
</html>
